<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>政治シミュレーションゲーム アイコン確認ページ</title>
  <style>
    /* 全体のレイアウトとテーマ変数 */
    :root {
      --bg-color: #e6f7fd;
      --text-color: #0b2447;
      --card-bg: rgba(255, 255, 255, 0.55);
      --card-border: rgba(11, 36, 71, 0.2);
      --tab-icon-color: #0b2447;
    }

    body.dark-bg {
      --bg-color: #0b2447;
      --text-color: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(138, 227, 250, 0.25);
      --tab-icon-color: #3dc7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--card-border);
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .toggle-btn {
      cursor: pointer;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(180deg, #3dc7ff 0%, #1c78e8 100%);
      border: 3px solid #0b2447;
      border-radius: 999px;
      box-shadow: 0 3px 0 #0b2447;
    }

    body.dark-bg .toggle-btn {
      border-color: #8ae3fa;
      box-shadow: 0 3px 0 #051329;
    }

    .toggle-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0b2447;
    }

    section {
      margin-bottom: 32px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.1rem;
      padding-left: 10px;
      border-left: 5px solid #3dc7ff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 8px;
      border-radius: 12px;
      background-color: var(--card-bg);
      border: 1.5px solid var(--card-border);
      gap: 8px;
    }

    .sizes {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 12px;
      min-height: 68px;
    }

    .tab-color {
      color: var(--tab-icon-color);
    }

    .icon-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      word-break: break-all;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>政治シミュレーションゲーム アイコン一覧</h1>
    <button type="button" id="bgToggleBtn" class="toggle-btn">背景を紺 (#0b2447) に切り替え</button>
  </header>

  <main id="previewRoot"></main>

  <script type="module">
    import { ICON_GROUPS, iconSvg } from "/src/ui/icons.js";

    // グループごとの日本語見出し
    const GROUP_TITLES = {
      act: "1. 毎月の活動 (act-)",
      exp: "2. 経験点 (exp-)",
      ab: "3. 基礎能力 (ab-)",
      field: "4. 得意分野 (field-)",
      tab: "5. 画面の切り替え (tab- / currentColor)",
      st: "6. 状態の表示 (st-)",
      gov: "7. 政権の行動 (gov-)",
      ev: "8. 出来事と結果 (ev-)",
    };

    const root = document.getElementById("previewRoot");
    const toggleBtn = document.getElementById("bgToggleBtn");

    // 背景色（#e6f7fd と #0b2447）の切り替え処理
    toggleBtn.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark-bg");
      toggleBtn.textContent = isDark
        ? "背景をシアン (#e6f7fd) に切り替え"
        : "背景を紺 (#0b2447) に切り替え";
    });

    // 各グループと全アイコンを 64px / 24px の2サイズで描画
    for (const [groupKey, ids] of Object.entries(ICON_GROUPS)) {
      const section = document.createElement("section");
      const heading = document.createElement("h2");
      heading.textContent = GROUP_TITLES[groupKey] || groupKey;
      section.appendChild(heading);

      const grid = document.createElement("div");
      grid.className = "grid";

      for (const id of ids) {
        const card = document.createElement("div");
        card.className = "card";

        const sizes = document.createElement("div");
        sizes.className = groupKey === "tab" ? "sizes tab-color" : "sizes";
        sizes.innerHTML = `${iconSvg(id, 64, id)}${iconSvg(id, 24, id)}`;

        const label = document.createElement("div");
        label.className = "icon-id";
        label.textContent = id;

        card.appendChild(sizes);
        card.appendChild(label);
        grid.appendChild(card);
      }

      section.appendChild(grid);
      root.appendChild(section);
    }
  </script>
</body>
</html>
